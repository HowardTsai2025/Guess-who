<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>猜猜我是誰 · 11/19 相調</title>
<meta name="description" content="11/19 相調：看描述，猜猜是誰">
<meta name="theme-color" content="#f6f2ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}

/* 版面：置中的翻牌卡片＋下方按鈕 */
:root{
  --bg:#f6f2ea; --paper:#fffdf8; --fg:#2b2925; --muted:#857c6e; --line:#e4dccd;
  --gold:#8b602e; --gold-soft:#c9a56b; --back:#3a2f22; --back-fg:#f6e7c8; --danger:#a8432f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1915; --paper:#26221c; --fg:#efe8dc; --muted:#a59a88; --line:#3a342b;
  --gold:#d9ae6c; --gold-soft:#8f7148; --back:#f1e3c4; --back-fg:#3a2a14; --danger:#e07a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1915; --paper:#26221c; --fg:#efe8dc; --muted:#a59a88; --line:#3a342b;
  --gold:#d9ae6c; --gold-soft:#8f7148; --back:#f1e3c4; --back-fg:#3a2a14; --danger:#e07a63; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--muted);font-size:13px;letter-spacing:.12em}
.brand b{font-family:var(--serif);font-size:22px;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* play */
#play{display:flex;flex-direction:column;align-items:center;gap:22px;flex:1}
.progress{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.bar{width:140px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-soft);width:0;transition:width .4s}
.scene{width:100%;max-width:440px;aspect-ratio:3/4;perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;container-type:inline-size;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px;box-sizing:border-box;text-align:center}
.front{background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 40px -18px rgba(60,40,10,.35)}
.front::before{content:"";width:48px;height:3px;background:var(--gold-soft);position:absolute;top:36px}
.nick{font-family:var(--serif);font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1.45;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;position:absolute;bottom:28px}
.back{background:var(--back);color:var(--back-fg);transform:rotateY(180deg)}
.back .nick{font-size:clamp(17px,4.4vw,22px);font-weight:500;opacity:.75}
.name{white-space:nowrap;font-family:var(--serif);font-weight:900;font-size:min(clamp(64px,19vw,112px),24cqi);letter-spacing:.06em;line-height:1.1}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font:500 16px var(--sans);padding:12px 22px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.done{font-family:var(--serif);font-size:24px}
.status{color:var(--muted);font-size:14px;text-align:center}

/* projection mode */
body.big .wrap{max-width:none;height:100%;padding-block:16px}
body.big .scene{max-width:min(calc((100vh - 210px) * .75),92vw)}
body.big .nick{font-size:clamp(32px,5.5vh,64px)}
body.big .back .nick{font-size:clamp(20px,3vh,32px)}
body.big .name{font-size:min(clamp(80px,16vh,190px),24cqi)}
body.big .hint{font-size:18px}

@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
</style>
</head>
<body class="big">
<div class="wrap">
  <header>
    <div class="brand"><small>11/19 相調</small><b>猜猜我是誰</b></div>
  </header>

  <section id="play">
    <div class="progress"><span id="count">載入中…</span><div class="bar"><i id="barfill"></i></div></div>
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="點一下翻牌">
      <div class="card" id="card">
        <div class="face front"><div class="nick" id="fNick">題庫載入中…</div><div class="hint" id="fHint">點一下揭曉</div></div>
        <div class="face back"><div class="nick" id="bNick"></div><div class="name" id="bName"></div></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="next">下一位</button>
      <button class="btn" id="restart">重新洗牌</button>
    </div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
let people=[], deck=[], pos=-1, flipped=false;
const full=p=>(p.surname||"")+(p.given||"");
/* ---------- play ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){deck=shuffle(people.map(p=>p.id));pos=-1;next()}
function next(){
  setFlip(false);
  const go=()=>{pos++;renderPlay()};
  flipped?setTimeout(go,0):go();
}
function current(){if(pos<0)return null;while(pos<deck.length){const p=people.find(x=>x.id===deck[pos]);if(p)return p;deck.splice(pos,1)}return null}
function renderPlay(){
  const total=deck.length, p=pos<total?current():null;
  $("#count").textContent=total?`第 ${Math.min(pos+1,deck.length)} / ${deck.length} 位`:"題庫是空的";
  $("#barfill").style.width=deck.length?(Math.min(pos+1,deck.length)/deck.length*100)+"%":"0";
  if(!people.length){$("#fNick").textContent="題庫是空的，請在 people.json 新增";$("#fHint").hidden=true;$("#next").disabled=true;return}
  $("#fHint").hidden=false;
  if(!p){$("#fNick").innerHTML='<span class="done">這一輪猜完了！</span>';$("#fHint").textContent="按「重新洗牌」再玩一輪";$("#next").disabled=true;$("#bNick").textContent="";$("#bName").textContent="";return}
  $("#next").disabled=false;$("#fHint").textContent="點一下揭曉";
  $("#fNick").textContent=p.nick;$("#bNick").textContent=p.nick;
  setTimeout(()=>{$("#bName").textContent=full(p)},flipped?0:350);
}
function setFlip(v){flipped=v;$("#card").classList.toggle("flipped",v)}
function tapCard(){if(pos<deck.length&&current())setFlip(!flipped)}
$("#scene").onclick=tapCard;
$("#scene").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();tapCard()}};
$("#next").onclick=()=>{setFlip(false);setTimeout(()=>{pos++;renderPlay()},flipped?0:250)};
$("#restart").onclick=()=>{setFlip(false);setTimeout(newRound,250)};
document.addEventListener("keydown",e=>{if($("#play").hidden||e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")$("#next").click()});


/* ---------- 讀取題庫（people.json）---------- */
fetch("people.json",{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(list=>{
    people=list.filter(p=>p&&p["名字"]).map((p,i)=>({id:"p"+i,nick:p["描述"]||"",surname:p["姓氏"]||"",given:p["名字"]}));
    newRound();
  })
  .catch(()=>{$("#count").textContent="";$("#fNick").textContent="題庫讀取失敗，請重新整理";$("#fHint").hidden=true;$("#next").disabled=true});
</script>
</body>
</html>
