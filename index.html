<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>按名呼叫</title>
<meta name="description" content="看描述，猜猜是誰">
<!-- 分享預覽（LINE、Facebook 等）：og:image 用 1200×630 滿版圖，網址必須是完整網址 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="按名呼叫">
<meta property="og:title" content="按名呼叫">
<meta property="og:description" content="看描述，猜猜是誰">
<meta property="og:url" content="https://howardtsai2025.github.io/guess-who/">
<meta property="og:image" content="https://howardtsai2025.github.io/guess-who/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="按名呼叫：看描述，猜猜是誰">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f6f2ea">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="按名呼叫">
<script>try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}button,.scene{touch-action:manipulation}body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}

/* 版面：置中的翻牌卡片＋下方按鈕 */
:root{
  --bg:#f6f2ea; --paper:#fffdf8; --fg:#2b2925; --muted:#857c6e; --line:#e4dccd;
  --gold:#8b602e; --gold-soft:#c9a56b; --back:#3a2f22; --back-fg:#f6e7c8; --danger:#a8432f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1915; --paper:#26221c; --fg:#efe8dc; --muted:#a59a88; --line:#3a342b;
  --gold:#d9ae6c; --gold-soft:#8f7148; --back:#f1e3c4; --back-fg:#3a2a14; --danger:#e07a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1915; --paper:#26221c; --fg:#efe8dc; --muted:#a59a88; --line:#3a342b;
  --gold:#d9ae6c; --gold-soft:#8f7148; --back:#f1e3c4; --back-fg:#3a2a14; --danger:#e07a63; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--muted);font-size:13px;letter-spacing:.12em}
.brand b{font-family:var(--serif);font-size:clamp(24px,min(5vw,6vh),36px);font-weight:900;letter-spacing:.08em;line-height:1.2;white-space:nowrap;color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* 右上角深淺色切換：淺色時顯示月亮，深色時顯示太陽 */
.theme-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--fg);
  display:grid;place-items:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.theme-btn svg{width:20px;height:20px}
.theme-btn .sun{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .sun{display:block}:root:not([data-theme="light"]) .theme-btn .moon{display:none}}
:root[data-theme="dark"] .theme-btn .sun{display:block}
:root[data-theme="dark"] .theme-btn .moon{display:none}

/* play */
#play{display:flex;flex-direction:column;align-items:center;gap:22px;flex:1}
.progress{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.bar{width:140px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-soft);width:0;transition:width .4s}
.scene{width:100%;max-width:440px;aspect-ratio:3/4;perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;container-type:inline-size;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px;box-sizing:border-box;text-align:center}
.front{background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 40px -18px rgba(60,40,10,.35)}
.front::before{content:"";width:48px;height:3px;background:var(--gold-soft);position:absolute;top:36px}
.nick{font-family:var(--serif);font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1.45;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;position:absolute;bottom:28px}
.back{background:var(--back);color:var(--back-fg);transform:rotateY(180deg)}
.back .nick{font-size:clamp(17px,4.4vw,22px);font-weight:500;opacity:.75}
.name{white-space:nowrap;font-family:var(--serif);font-weight:900;font-size:min(clamp(64px,19vw,112px),24cqi);letter-spacing:.06em;line-height:1.1}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font:500 16px var(--sans);padding:12px 22px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.done{font-family:var(--serif);font-size:24px}
/* 一輪結束：經文卡，出處放右下角小字 */
.verse{display:block;white-space:nowrap;text-align:center}
.ref{position:absolute;right:32px;bottom:28px;color:var(--muted);font-size:14px;letter-spacing:.08em}
body.big .ref{font-size:clamp(14px,3cqi,22px)}
.status{color:var(--muted);font-size:14px;text-align:center}

/* projection mode */
body.big .wrap{max-width:none;height:100%;padding-block:16px}
body.big .scene{max-width:min(calc((100vh - 220px) * .75),92vw);max-width:min(calc((100svh - 220px) * .75),92vw)}
body.big .nick{font-size:clamp(32px,5.5vh,64px)}
body.big .back .nick{font-size:clamp(20px,3vh,32px)}
body.big .name{font-size:min(clamp(80px,16vh,190px),24cqi)}
body.big .hint{font-size:18px}
/* 橫放（iPad 橫屏、電腦螢幕）：卡片自動變成橫式，空間更大 */
@media (orientation:landscape){
  body.big .scene{aspect-ratio:3/2;max-width:min(calc((100vh - 220px) * 1.5),92vw);max-width:min(calc((100svh - 220px) * 1.5),92vw)}
  body.big .face{gap:18px}
  body.big .name{font-size:min(clamp(80px,18vh,200px),24cqi)}
}
@media (orientation:landscape) and (max-height:520px){
  body.big .wrap{gap:10px;padding-block:8px}
  body.big #play{gap:12px}
  body.big .scene{max-width:min(calc((100svh - 180px) * 1.5),92vw)}
  body.big .front::before{top:18px}
  body.big .hint{bottom:14px;font-size:14px}
}
/* 字體盡量放大：跟著卡片大小縮放，坐遠也看得清楚 */
body.big .front .nick{font-size:clamp(26px,11cqi,120px);line-height:1.35}
body.big .name{font-size:calc((100cqi - 72px) / 3.25)}
body.big .hint{font-size:clamp(16px,3.6cqi,26px)}
body.big .btn{font-size:20px;padding:14px 28px}
body.big .progress{font-size:18px}
#bNick{display:none}

.front .nick.keep{word-break:keep-all;overflow-wrap:normal}

/* 進度移到標題列，卡片可以更大；按鈕和下緣留白 */
header{flex-wrap:nowrap}
header .progress{flex:1;justify-content:center;min-width:0}
header .bar{width:clamp(40px,12vw,140px)}
body.big .wrap{padding-bottom:32px}
body.big .scene{max-width:min(calc((100vh - 198px) * .75),92vw);max-width:min(calc((100svh - 198px) * .75),92vw)}
@media (orientation:landscape){body.big .scene{max-width:min(calc((100vh - 198px) * 1.5),92vw);max-width:min(calc((100svh - 198px) * 1.5),92vw)}}
@media (orientation:landscape) and (max-height:520px){body.big .ref{right:18px;bottom:12px;font-size:12px}body.big .wrap{padding-bottom:14px}body.big .scene{max-width:min(calc((100svh - 154px) * 1.5),92vw)}}
@media (max-width:420px){header .progress{font-size:14px;gap:8px}}



@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
</style>
</head>
<body class="big">
<div class="wrap">
  <header>
    <div class="brand"><b>按名呼叫</b></div>
    <div class="progress"><span id="count">載入中…</span><div class="bar"><i id="barfill"></i></div></div>
    <button class="theme-btn" id="themeBtn" aria-label="切換深色／淺色">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <section id="play">
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="點一下翻牌">
      <div class="card" id="card">
        <div class="face front"><div class="nick" id="fNick">題庫載入中…</div><div class="hint" id="fHint">點一下揭曉</div><div class="ref" id="fRef" hidden>約翰福音 10:3</div></div>
        <div class="face back"><div class="nick" id="bNick"></div><div class="name" id="bName"></div></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="next">下一位</button>
      <button class="btn" id="restart">重新洗牌</button>
    </div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
/* ---------- 鎖定縮放：不能點兩下放大，也不能兩指放大（iPhone／iPad Safari 會忽略 viewport 設定，所以另外擋手勢）---------- */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;document.addEventListener("touchend",e=>{const now=Date.now();if(now-lastTouchEnd<=350){e.preventDefault();e.target.closest("button,.scene")?.click()}lastTouchEnd=now},{passive:false});
/* ---------- 深淺色切換（預設跟著裝置，按過會記住）---------- */
const darkMQ=matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":darkMQ.matches};
const syncThemeColor=()=>{$('meta[name="theme-color"]').content=isDark()?"#1c1915":"#f6f2ea"};
$("#themeBtn").onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}syncThemeColor()};
darkMQ.addEventListener?.("change",syncThemeColor);syncThemeColor();
let people=[], deck=[], pos=-1, flipped=false;
const full=p=>(p.surname||"")+(p.given||"");
/* ---------- play ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){deck=shuffle(people.map(p=>p.id));pos=-1;next()}
function next(){
  setFlip(false);
  const go=()=>{pos++;renderPlay()};
  flipped?setTimeout(go,0):go();
}
function current(){if(pos<0)return null;while(pos<deck.length){const p=people.find(x=>x.id===deck[pos]);if(p)return p;deck.splice(pos,1)}return null}
function renderPlay(){
  const total=deck.length, p=pos<total?current():null;
  $("#count").textContent=total?`第 ${Math.min(pos+1,deck.length)} / ${deck.length} 位`:"題庫是空的";
  $("#barfill").style.width=deck.length?(Math.min(pos+1,deck.length)/deck.length*100)+"%":"0";
  if(!people.length){$("#fNick").textContent="題庫是空的，請在 people.json 新增";$("#fHint").hidden=true;$("#next").disabled=true;return}
  $("#fHint").hidden=false;$("#fRef").hidden=true;
  if(!p){$("#fNick").classList.add("keep");$("#fNick").innerHTML="<span class=\"verse\">⋯他按著名</span><span class=\"verse\">叫自己的羊</span><span class=\"verse\">領牠們出來</span>";$("#fHint").hidden=true;$("#fRef").hidden=false;$("#next").disabled=true;$("#bNick").textContent="";$("#bName").textContent="";return}
  $("#next").disabled=false;$("#fHint").textContent="點一下揭曉";
  setNick(p.nick);$("#bNick").textContent=p.nick;
  setTimeout(()=>{$("#bName").textContent=full(p)},flipped?0:350);
}

/* ---------- 正面描述：自動找出放得下的最大字級（優先在「的」後面換行）---------- */
function setNick(t){const n=$("#fNick");const s=String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  n.classList.toggle("keep",t.includes("的"));n.innerHTML=s.replace(/的/g,"的<wbr>")}
function fitNick(){
  const n=$("#fNick"),f=n.parentElement;if(!f||!f.clientHeight)return;
  const W=f.clientWidth-64,verse=n.querySelector(".verse");let H=f.clientHeight-(f.clientHeight<320?76:170),lo=18,hi=240;
  /* 經文卡：上下都留出右下角出處的高度，經文才不會壓到出處 */
  if(verse){const band=f.clientHeight-$("#fRef").offsetTop+6;H=Math.min(H,f.clientHeight-2*band);lo=8}
  n.style.width=W+"px";
  for(let i=0;i<12;i++){const m=(lo+hi)/2;n.style.fontSize=m+"px";(n.scrollWidth<=W+1&&n.scrollHeight<=H)?lo=m:hi=m}
  n.style.fontSize=Math.floor(lo)+"px";
}
let fitT;addEventListener("resize",()=>{clearTimeout(fitT);fitT=setTimeout(fitNick,80)});
document.fonts&&document.fonts.ready.then(()=>fitNick());
const _renderPlay=renderPlay;renderPlay=function(){$("#fNick").classList.remove("keep");_renderPlay();requestAnimationFrame(fitNick)};
function setFlip(v){flipped=v;$("#card").classList.toggle("flipped",v)}
function tapCard(){if(pos<deck.length&&current())setFlip(!flipped)}
$("#scene").onclick=tapCard;
$("#scene").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();tapCard()}};
$("#next").onclick=()=>{setFlip(false);setTimeout(()=>{pos++;renderPlay()},flipped?0:250)};
$("#restart").onclick=()=>{setFlip(false);setTimeout(newRound,250)};
document.addEventListener("keydown",e=>{if($("#play").hidden||e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")$("#next").click()});


/* ---------- 讀取題庫（people.json）---------- */
fetch("people.json",{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(list=>{
    people=list.filter(p=>p&&p["名字"]).map((p,i)=>({id:"p"+i,nick:p["描述"]||"",surname:p["姓氏"]||"",given:p["名字"]}));
    newRound();
  })
  .catch(()=>{$("#count").textContent="";$("#fNick").textContent="題庫讀取失敗，請重新整理";$("#fHint").hidden=true;$("#next").disabled=true});
</script>
</body>
</html>
